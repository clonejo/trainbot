[workspace]
members = [
    "crates/cv/pmatch",
    "crates/cv/avg",
    "crates/cv/ransac",
    "crates/imutil",
    "crates/store",
    "bin/trainbot",
    "tests/conformance",
]
resolver = "2"

[workspace.dependencies]
camino = "1"
image = { version = "0.25", default-features = false }
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

[profile.release]
debug = "line-tables-only"
