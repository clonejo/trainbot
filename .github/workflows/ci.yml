on: [push]
name: ci

jobs:
  go_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        uses: ./.github/actions/cached-docker-build
        id: cached-docker-build
        with:
          target: docker_build
      - name: List build artifacts
        run: ls -lah build/
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            build/
  go_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        uses: ./.github/actions/cached-docker-build
        id: cached-docker-build
        with:
          target: docker_lint
  go_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        uses: ./.github/actions/cached-docker-build
        id: cached-docker-build
        with:
          target: docker_test
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testlogs
          path: |
            internal/pkg/stitch/testdata/*.mkv.log
  go_bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        uses: ./.github/actions/cached-docker-build
        id: cached-docker-build
        with:
          target: docker_bench
  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Run
        uses: ./.github/actions/cached-docker-build
        id: cached-docker-build
        with:
          chdir: frontend
          target: docker_build
      - name: List build artifacts
        run: ls -lah frontend/dist/
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            frontend/dist/

  rust_static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@cross
      - name: Build static binary
        run: cross build --release --target ${{ matrix.target }} -p trainbot
      - name: Static-binary gate (no dynamic deps)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin=target/${{ matrix.target }}/release/trainbot
          file "$bin"
          file "$bin" | grep -q "statically linked"
      - name: Static-binary gate (aarch64 — readelf check)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          bin=target/${{ matrix.target }}/release/trainbot
          file "$bin"
          ! readelf -d "$bin" 2>/dev/null | grep -q NEEDED
      - name: Archive binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/trainbot

  rust_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install clang for bindgen (v4l2-sys, rusqlite bundled)
        run: sudo apt-get install -y clang libclang-dev linux-libc-dev ffmpeg
      - name: Test CV crates
        run: cargo test -p pmatch -p avg -p ransac
      - name: Test vid crate
        run: cargo test -p vid

  rust_conformance:
    runs-on: ubuntu-latest
    needs: [go_build, rust_static]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Go oracle binary
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: build/
      - name: Make oracle executable
        run: chmod +x build/trainbot
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build conformance harness
        run: cargo build -p conformance
      - name: Run conformance harness (Phase 0 — oracle is runnable)
        run: cargo run -p conformance -- build/trainbot
